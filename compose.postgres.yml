services:
  postgres:
    image: ${EGG_POSTGRES_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/pgvector/pgvector:pg17}
    container_name: egg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EGG_POSTGRES_DB:-egg}
      POSTGRES_USER: ${EGG_POSTGRES_USER:-egg}
      POSTGRES_PASSWORD: ${EGG_POSTGRES_PASSWORD:-egg_dev_password}
      TZ: Asia/Shanghai
    ports:
      - "${EGG_POSTGRES_PORT:-5432}:5432"
    volumes:
      - egg-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${EGG_REDIS_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis/redis-stack-server:7.4.0-v8}
    container_name: egg-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${EGG_REDIS_PORT:-6381}:6379"
    volumes:
      - egg-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: ${EGG_MINIO_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/minio:latest}
    container_name: egg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${EGG_MINIO_ROOT_USER:-eggminio}
      MINIO_ROOT_PASSWORD: ${EGG_MINIO_ROOT_PASSWORD:-egg_minio_dev_password}
    ports:
      - "${EGG_MINIO_API_PORT:-9000}:9000"
      - "${EGG_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - egg-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  egg-postgres-data:
  egg-redis-data:
  egg-minio-data:
