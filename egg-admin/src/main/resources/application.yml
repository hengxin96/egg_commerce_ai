# 项目相关配置
egg:
  # 名称
  name: Egg
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/egg/uploadPath，Linux配置 /home/egg/uploadPath）
  profile: D:/egg/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
  # AI 电商业务配置
  # 这些配置集中描述第一版必须跑通的 AI 存储、RAG 和模型网关模块。
  # - storage/alioss: 商品原图、AI 生成图、编辑图和导出包都进入阿里 OSS，不能依赖模型临时 URL。
  # - rag/local|milvus: 本地开发默认使用内存向量检索；接入真实 Milvus 时通过 EGG_AI_VECTOR_STORE=milvus 切换。
  # - model-gateway: 文本、视觉理解、图片生成和 Embedding 都走统一模型网关，方便日志、重试、成本和密钥管理。
  ai:
    mock-enabled: ${EGG_AI_MOCK_ENABLED:true}
    storage:
      provider: alioss
      alioss:
        endpoint: ${EGG_ALIOSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
        bucket: ${EGG_ALIOSS_BUCKET:zhx-img-test}
        access-key-id: ${EGG_ALIOSS_ACCESS_KEY_ID:}
        access-key-secret: ${EGG_ALIOSS_ACCESS_KEY_SECRET:}
        object-prefix: ${EGG_ALIOSS_OBJECT_PREFIX:ai}
    rag:
      enabled: ${EGG_RAG_ENABLED:true}
      vector-store: ${EGG_AI_VECTOR_STORE:milvus}
      chunk-size: ${EGG_RAG_CHUNK_SIZE:800}
      chunk-overlap: ${EGG_RAG_CHUNK_OVERLAP:120}
      top-k: ${EGG_RAG_TOP_K:6}
      min-score: ${EGG_RAG_MIN_SCORE:0.62}
      embedding-dimension: ${EGG_RAG_EMBEDDING_DIMENSION:1536}
      milvus:
        host: ${EGG_MILVUS_HOST:localhost}
        port: ${EGG_MILVUS_PORT:19530}
        username: ${EGG_MILVUS_USERNAME:}
        password: ${EGG_MILVUS_PASSWORD:}
        database: ${EGG_MILVUS_DATABASE:default}
        collection: ${EGG_MILVUS_COLLECTION:vector_store}
    model-gateway:
      text:
        provider: ${EGG_MODEL_TEXT_PROVIDER:dashscope}
        model: ${EGG_MODEL_TEXT_NAME:qwen3.7-max}
        api-key: ${EGG_DASHSCOPE_API_KEY:}
      image:
        provider: ${EGG_MODEL_IMAGE_PROVIDER:dashscope}
        model: ${EGG_MODEL_IMAGE_NAME:wan2.7-image-pro}
        endpoint: ${EGG_DASHSCOPE_ENDPOINT:https://dashscope.aliyuncs.com}
        api-key: ${EGG_DASHSCOPE_API_KEY:}
      embedding:
        provider: ${EGG_MODEL_EMBEDDING_PROVIDER:dashscope}
        model: ${EGG_MODEL_EMBEDDING_NAME:text-embedding-v4}
        api-key: ${EGG_DASHSCOPE_API_KEY:}

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    # 当前com.egg.commerce路径下的日志级别
    com.egg.commerce: debug
    # spring的日志级别
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  ai:
    vectorstore:
      type: ${EGG_AI_VECTOR_STORE:milvus}
      milvus:
        # Existing local Milvus collections are managed outside app startup; enable only when a fresh schema must be created.
        initialize-schema: ${EGG_MILVUS_INITIALIZE_SCHEMA:false}
        database-name: ${EGG_MILVUS_DATABASE:default}
        collection-name: ${EGG_MILVUS_COLLECTION:vector_store}
        embedding-dimension: ${EGG_RAG_EMBEDDING_DIMENSION:1536}
        client:
          host: ${EGG_MILVUS_HOST:localhost}
          port: ${EGG_MILVUS_PORT:19530}
          username: ${EGG_MILVUS_USERNAME:}
          password: ${EGG_MILVUS_PASSWORD:}
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  # 数据库配置，读取druid.yml
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 100MB
      # 设置总上传的文件大小
      max-request-size: 300MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: ${EGG_REDIS_DATABASE:0}
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${EGG_TOKEN_SECRET:change-me-please-use-env}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.egg.commerce.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  # 分页 SQL 按 PostgreSQL 生成
  helperDialect: postgresql
  # 允许从方法参数读取分页参数
  supportMethodsArguments: true
  # 分页参数映射
  params: count=countSql

# Springdoc API文档配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    # 是否启用 Swagger UI 及访问路径
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  # 接口文档分组，现在只扫描 ai 控制器包
  group-configs:
    - group: 'default'
      display-name: 'ai模块接口'
      paths-to-match: '/**'
      packages-to-scan: com.egg.commerce.web.controller.ai

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许访问资源的域名列表
  allowed-domains: localhost,127.0.0.1,egg.vip,www.egg.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
